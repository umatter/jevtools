# jevtools serve --config examples/proxy/jevtools.toml --host 127.0.0.1 --port 8787
#
# An OpenAI-compatible proxy (spec §7.2.4) over the demo world: synthetic contacts, accounts and workspace files
# (examples/proxy/data/*.json, generated by examples/fixtures/regenerate.py). Clients send their own tools with each
# request; the proxy answers with Jev. Relative paths resolve against this file's directory.

model_name = "jevtools"          # what clients send as `model` (GET /v1/models lists it)
pending_ttl_s = 900              # CONFIRM/CLARIFY cards stay resumable for 15 minutes

[backend]
type = "auto"                    # TYPESAFE_API_KEY → TypeSafe; else OPENROUTER_API_KEY → OpenRouter Decisions
allow_offline = true             # no key: the LexicalSimulator, an offline test double that is NOT Jev (a warning is
                                 # printed; its answers are never evidence about Jev). Set false in production.

[context]                        # defaults of every request; a request may override them via extra_body
tz = "Europe/Zurich"
locale = "en-CH"
user = {name = "Sam Muster", home_city = "Zurich"}

[[sources]]                      # a registry from a JSON file of rows
name = "contacts"
path = "data/contacts.json"
key = "email"
label = "{name} <{email}>"
describe = "{notes}"
match = ["name", "aliases", "team"]
provides = ["email", "person"]
attrs = ["name", "team"]
recency = "last"

[[sources]]                      # small registries (≤ 12 rows) are sent whole; balances stay server-side
name = "accounts"
path = "data/accounts.json"
key = "id"
label = "{nickname} · {currency} · {iban_masked}"
describe = "{nickname} account in {currency}"
match = ["nickname"]
provides = ["account_id"]
attrs = ["nickname", "currency", "balance"]

[[sources]]                      # a file index over a JSON list of workspace paths
name = "files"
type = "files"
path = "data/files.json"
synonyms = {config = ["conf", "cfg", "settings", "values", "yaml", "toml", "ini", "env"], payments = ["payment", "pay"]}

# Optional LLM roles (OpenAI-compatible endpoints, e.g. OpenRouter with the same OPENROUTER_API_KEY):
# [text_llm]                     # writes the answer when Jev says NO_TOOL (abstain)
# model = "openai/gpt-4o-mini"
# [fallback_llm]                 # anything jevtools cannot serve is forwarded unchanged (graceful degradation)
# model = "openai/gpt-4o-mini"
