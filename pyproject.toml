[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevtools"
version = "0.1.0"
description = "Tool calling for TypeSafe's Jev: every argument value is elected from code-built candidate pools."
requires-python = ">=3.10"
license = "MIT"
keywords = ["jev", "typesafe", "tool-calling", "agents", "llm", "calibration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
serve = ["starlette", "uvicorn"]
langchain = ["langchain-core>=0.3"]
pydantic-ai = ["pydantic-ai-slim>=1.0,<2"]
mcp = ["mcp>=1.10"]
yaml = ["pyyaml"]
jsonschema = ["jsonschema>=4"]
all = ["jevtools[serve,langchain,pydantic-ai,mcp,yaml,jsonschema]"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
jevtools = "jevtools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls a real Jev endpoint; skipped unless TYPESAFE_API_KEY or OPENROUTER_API_KEY is set",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
# docs/SPEC.md is normative: its code blocks are quoted as written, never reformatted
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/jevtools"]
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-first-party = ["jevtools", "tests"]

[tool.ruff.lint.per-file-ignores]
# The scaffold ScriptedBackend keeps typing.Union in runtime type aliases.
"src/jevtools/backends/scripted.py" = ["UP007"]
